[workspace]
members = [
    "programs/*"
]
resolver = "2"

# The same release profile as lamport-vault: checked arithmetic stays on in the program.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
