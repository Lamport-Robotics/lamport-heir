[package]
name = "heir-claim"
version = "0.1.0"
description = "Lamport Heir: the claim program"
edition = "2021"
license = "MIT"
repository = "https://github.com/Lamport-Robotics/lamport-heir"

[lib]
crate-type = ["cdylib", "lib"]
name = "heir_claim"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "token_2022"] }
solana-sha256-hasher = { version = "2.3", default-features = false }

[dev-dependencies]
hex = "0.4"

# The toolchain lamport-vault pins: platform-tools v1.48 (bundled with Agave 2.3) cannot compile
# edition-2024 dependencies; v1.56 can. cargo-build-sbf reads this key.
[package.metadata.solana]
tools-version = "v1.56"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
