name: test

# rust   the claim program's unit tests on the host: terms, the tombstone reader, proofs of control,
#        who may claim and when.
# svm    the program built for Solana (agave 2.3.13, platform-tools v1.56: the pins lamport-vault
#        builds with) and run in LiteSVM, where the tests can move the clock: every instruction,
#        every refusal, and random sequences against a model of the rules.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGAVE_VERSION: "2.3.13"
  AGAVE_INSTALL_SHA256: "44f37013c80bf1122067b250da38339a0b061dafde1f4162f037b4ce0008afa5"
  # cargo-build-sbf reads tools-version from programs/*/Cargo.toml and fetches this into
  # ~/.cache/solana on first use; the cache below keeps it.
  PLATFORM_TOOLS: v1.56

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10, toolchain: stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --locked

  svm:
    name: heir-claim in litesvm
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10, toolchain: stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: svm
          workspaces: |
            . -> target
            tests/svm -> target
          cache-targets: true

      - name: Cache platform-tools and the SBF toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/solana
          key: platform-tools-${{ env.PLATFORM_TOOLS }}-${{ runner.os }}
          restore-keys: |
            platform-tools-${{ env.PLATFORM_TOOLS }}-

      - name: Cache agave ${{ env.AGAVE_VERSION }}
        id: agave-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/solana/install
          key: agave-${{ env.AGAVE_VERSION }}-${{ runner.os }}

      - name: Install agave ${{ env.AGAVE_VERSION }}
        if: steps.agave-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://release.anza.xyz/v${AGAVE_VERSION}/install" -o /tmp/agave-install.sh
          echo "${AGAVE_INSTALL_SHA256}  /tmp/agave-install.sh" | sha256sum -c -
          sh /tmp/agave-install.sh

      - name: Add agave to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain pin
        run: |
          grep -q "tools-version = \"$PLATFORM_TOOLS\"" programs/heir-claim/Cargo.toml \
            || { echo "programs/heir-claim/Cargo.toml must pin tools-version = \"$PLATFORM_TOOLS\""; exit 1; }

      - name: Build heir_claim.so
        run: |
          cargo build-sbf --version
          cargo build-sbf --manifest-path programs/heir-claim/Cargo.toml -- --locked
          ls -l target/deploy/heir_claim.so
          sha256sum target/deploy/heir_claim.so

      # run from inside the crate: its rust-toolchain.toml pins the toolchain litesvm's agave crates need
      - name: cargo test (tests/svm)
        working-directory: tests/svm
        run: cargo test --locked

  mutants:
    # Breaks the program one way at a time and requires the LiteSVM suite to notice each time
    # (tests/mutants/run.py). It fails when a mutant survives: a rule that no test defends.
    name: every mutant is caught
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10, toolchain: stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: mutants
          workspaces: |
            . -> target
            tests/svm -> target
          cache-targets: true

      - name: Cache platform-tools and the SBF toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/solana
          key: platform-tools-${{ env.PLATFORM_TOOLS }}-${{ runner.os }}
          restore-keys: |
            platform-tools-${{ env.PLATFORM_TOOLS }}-

      - name: Cache agave ${{ env.AGAVE_VERSION }}
        id: agave-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/solana/install
          key: agave-${{ env.AGAVE_VERSION }}-${{ runner.os }}

      - name: Install agave ${{ env.AGAVE_VERSION }}
        if: steps.agave-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://release.anza.xyz/v${AGAVE_VERSION}/install" -o /tmp/agave-install.sh
          echo "${AGAVE_INSTALL_SHA256}  /tmp/agave-install.sh" | sha256sum -c -
          sh /tmp/agave-install.sh

      - name: Add agave to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Mutation check
        run: python3 tests/mutants/run.py
