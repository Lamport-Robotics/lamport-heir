name: verify

# Reproducible build of the claim program with solana-verify (Docker), the way lamport-vault's
# verify.yml builds the vault, and, on a release tag, comparison with the program deployed on
# that cluster.
#
#   push to main        build, print hashes, upload the .so files
#   tag devnet-<x>      same, then compare the devnet row with devnet and fail on mismatch
#   tag mainnet-<x>     same, for the mainnet row against mainnet-beta
#
# A deployment is the artifact this job uploads, and the hash it prints is the one that must be on
# chain. docs/program-ids.md lists the ids; lamport-vault's docs/VERIFY.md has the full story.

on:
  push:
    branches: [main]
    tags: ["devnet-*", "mainnet-*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLANA_VERIFY_VERSION: "0.5.2"
  # The image lamport-vault builds with (Agave 2.3.13), pinned by digest so a re-tagged image
  # cannot change the build. cargo-build-sbf inside it reads tools-version from the program's
  # Cargo.toml and fetches platform-tools v1.56.
  BASE_IMAGE: solanafoundation/solana-verifiable-build@sha256:0cf72459e089f3a928efd48b718d81817a8c1c380229edee2099dd651aaef3b9
  PLATFORM_TOOLS: v1.56

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One row per program that gets deployed. `cluster` is the tag prefix the row is compared
        # under; `features` are the cargo features that compile in that deployment's pair of ids.
        include:
          - name: heir_claim
            cluster: devnet
            features: ""
            program_id: cvxRorjDzekSCcAyiinzgALnBT1dTuUdVvEraPeDkUW
          - name: heir_claim-mainnet
            cluster: mainnet
            features: mainnet
            program_id: L8EWcWfZbPu3iWNSkShaFJYwLgQ5vAdjLQNzP2DY8Yf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the toolchain pins
        run: |
          grep -q "tools-version = \"$PLATFORM_TOOLS\"" programs/heir-claim/Cargo.toml \
            || { echo "programs/heir-claim/Cargo.toml must pin tools-version = \"$PLATFORM_TOOLS\""; exit 1; }
          grep -A1 'name = "anchor-lang"' Cargo.lock | grep -q 'version = "0.32.' \
            || { echo "Cargo.lock must resolve anchor-lang 0.32.x"; exit 1; }

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10, toolchain: stable
        with:
          toolchain: stable

      - name: Cache solana-verify
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ env.SOLANA_VERIFY_VERSION }}-${{ runner.os }}

      - name: Install solana-verify
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked solana-verify --version "$SOLANA_VERIFY_VERSION"

      - name: Build ${{ matrix.name }} in ${{ env.BASE_IMAGE }}
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -n "$FEATURES" ]; then
            solana-verify build --library-name heir_claim --base-image "$BASE_IMAGE" -- --features "$FEATURES"
          else
            solana-verify build --library-name heir_claim --base-image "$BASE_IMAGE"
          fi

      - name: Hash
        id: hash
        run: |
          so=target/deploy/heir_claim.so
          hash=$(solana-verify get-executable-hash "$so" | tail -n1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.name }}"
            echo
            echo "program id \`${{ matrix.program_id }}\` (${{ matrix.cluster }}), features: \`${{ matrix.features || 'default' }}\`"
            echo
            echo '```'
            echo "commit   $GITHUB_SHA"
            echo "hash     $hash"
            echo "size     $(wc -c < "$so") bytes"
            echo "image    $BASE_IMAGE (platform-tools $PLATFORM_TOOLS)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${{ matrix.name }} $hash"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}-${{ github.sha }}
          path: target/deploy/heir_claim.so
          if-no-files-found: error

      - name: Compare with the deployed program
        # a row is compared only under its own cluster's tag: a devnet tag says nothing about mainnet
        if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, format('{0}-', matrix.cluster))
        run: |
          case "$GITHUB_REF_NAME" in
            devnet-*)  url=https://api.devnet.solana.com ;;
            mainnet-*) url=https://api.mainnet-beta.solana.com ;;
            *) echo "tag must start with devnet- or mainnet-"; exit 1 ;;
          esac
          built="${{ steps.hash.outputs.hash }}"
          onchain=$(solana-verify get-program-hash --url "$url" ${{ matrix.program_id }} | tail -n1)
          echo "built     $built"
          echo "on-chain  $onchain  (${{ matrix.program_id }} on $url)"
          {
            echo
            echo "on-chain \`$onchain\` at \`$url\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$built" != "$onchain" ]; then
            echo "MISMATCH: the program on $url is not this commit" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "MATCH" | tee -a "$GITHUB_STEP_SUMMARY"
